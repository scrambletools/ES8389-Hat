002" y2="616.8885319999999" stroke="#bbb" stroke-width="1.6"/><rect x="1272.0" y="700" width="176" height="34" rx="17.0" fill="#7d3c98"/><text x="1360.0" y="723.3" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#fff" text-anchor="middle" font-weight="bold">DET</text><rect x="1272.0" y="742" width="176" height="34" rx="17.0" fill="#dcdcdc"/><text x="1360.0" y="764.95" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#333" text-anchor="middle" font-weight="bold">GPIO21</text><rect x="1272.0" y="784" width="176" height="34" rx="17.0" fill="#e8e8e8"/><text x="1360.0" y="806.95" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#333" text-anchor="middle" font-weight="bold">GP28 (34)</text><circle cx="1095.4071870000002" cy="602.8885319999999" r="13" fill="#d4af37" stroke="#8a731f" stroke-width="2"/><text x="1095.4071870000002" y="607.8885319999999" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#333" text-anchor="middle" font-weight="bold">7</text><circle cx="150" cy="868" r="5" fill="#2e8b57"/><text x="168" y="874" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#444" text-anchor="start">BCLK/LRCK are adjacent (GP3/GP4, WS = BCLK+1) — stock side-set PIO I²S works on the Pico unmodified.</text><circle cx="150" cy="898" r="5" fill="#2b6cb0"/><text x="168" y="904" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#444" text-anchor="start">SDA/SCL land on GP0/GP1 — hardware I²C0, the MicroPython default pair.</text><circle cx="150" cy="928" r="5" fill="#0f766e"/><text x="168" y="934" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#444" text-anchor="start">MCLK sits over the Pico’s ADC_VREF (✕ = not a GPIO): harmless, both ends passive. Pico runs the ES8389 in SCLK-source</text><circle cx="150" cy="958" r="5" fill="#0f766e"/><text x="168" y="964" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#444" text-anchor="start">mode (reg 0x02 bit 6 = 0). R28 (0 Ω, at J4.6) is fitted by default — lift it on a Pico build that uses the Pico’s own ADC.</text><circle cx="150" cy="988" r="5" fill="#7d3c98"/><text x="168" y="994" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#444" text-anchor="start">DET (instrument auto-detect, active-low) works on both hosts via GP28.  ·  pass-thru pins are unused by the hat.</text></svg>