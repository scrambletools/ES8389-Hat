ans-serif" font-size="19" fill="#333" text-anchor="middle" font-weight="bold">GPIO17</text><rect x="480" y="531" width="150" height="42" rx="21.0" fill="#2e8b57"/><text x="555.0" y="558.65" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#fff" text-anchor="middle" font-weight="bold">BCLK</text><circle cx="677" cy="552" r="16" fill="#d4af37" stroke="#8a731f" stroke-width="2"/><text x="677" y="558" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#333" text-anchor="middle" font-weight="bold">5</text><line x1="905" y1="552" x2="1260" y2="552" stroke="#ccc" stroke-width="2"/><circle cx="883" cy="552" r="16" fill="#d4af37" stroke="#8a731f" stroke-width="2"/><text x="883" y="558" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#333" text-anchor="middle" font-weight="bold">5</text><rect x="930" y="531" width="150" height="42" rx="21.0" fill="#e67e22"/><text x="1005.0" y="558.65" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#fff" text-anchor="middle" font-weight="bold">+3V3</text><rect x="1095" y="531" width="150" height="42" rx="21.0" fill="#dcdcdc"/><text x="1170.0" y="558.65" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#333" text-anchor="middle" font-weight="bold">3V3</text><rect x="1260" y="531" width="185" height="42" rx="21.0" fill="#e8e8e8"/><text x="1352.5" y="557.6" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#333" text-anchor="middle" font-weight="bold">3V3 (36)</text><line x1="300" y1="640" x2="655" y2="640" stroke="#ccc" stroke-width="2"/><rect x="130" y="619" width="170" height="42" rx="21.0" fill="#e8e8e8"/><text x="215.0" y="646.65" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#333" text-anchor="middle" font-weight="bold">GP4</text><rect x="315" y="619" width="150" height="42" rx="21.0" fill="#dcdcdc"/><text x="390.0" y="646.65" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#333" text-anchor="middle" font-weight="bold">GPIO16</text><rect x="480" y="619" width="150" height="42" rx="21.0" fill="#2e8b57"/><text x="555.0" y="646.65" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#fff" text-anchor="middle" font-weight="bold">LRCK</text><circle cx="677" cy="640" r="16" fill="#d4af37" stroke="#8a731f" stroke-width="2"/><text x="677" y="646" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#333" text-anchor="middle" font-weight="bold">6</text><line x1="905" y1="640" x2="1260" y2="640" stroke="#ccc" stroke-width="2"/><circle cx="883" cy="640" r="16" fill="#d4af37" stroke="#8a731f" stroke-width="2"/><text x="883" y="646" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#333" text-anchor="middle" font-weight="bold">6</text><rect x="930" y="619" width="150" height="42" rx="21.0" fill="#0f766e"/><text x="1005.0" y="646.65" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#fff" text-anchor="middle" font-weight="bold">MCLK</text><rect x="1095" y="619" width="150" height="42" rx="21.0" fill="#dcdcdc"/><text x="1170.0" y="646.65" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#333" text-anchor="middle" font-weight="bold">GPIO20</text><rect x="1260" y="619" width="185" height="42" rx="21.0" fill="#e8e8e8"/><text x="1352.5" y="645.6" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#333" text-anchor="middle" font-weight="bold">ADC_VREF (35) ✕</text><line x1="300" y1="728" x2="655" y2="728" stroke="#ccc" stroke-width="2"/><rect x="130" y="707" width="170" height="42" rx="21.0" fill="#e8e8e8"/><text x="215.0" y="734.65" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#333" text-anchor="middle" font-weight="bold">GP5</text><rect x="315" y="707" width="150" height="42" rx="21.0" fill="#dcdcdc"/><text x="390.0" y="734.65" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#333" text-anchor="middle" font-weight="bold">GPIO15</text><rect x="480" y="707" width="150" height="42" rx="21.0" fill="#2e8b57"/><text x="555.0" y="734.65" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#fff" text-anchor="middle" font-weight="bold">ASDOUT</text><circle cx="677" cy="728" r="16" fill="#d4af37" stroke="#8a731f" stroke-width="2"/><text x="677" y="734" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#333" text-anchor="middle" font-weight="bold">7</text><line x1="905" y1="728" x2="1260" y2="728" stroke="#ccc" stroke-width="2"/><circle cx="883" cy="728" r="16" fill="#d4af37" stroke="#8a731f" stroke-width="2"/><text x="883" y="734" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#333" text-anchor="middle" font-weight="bold">7</text><rect x="930" y="707" width="150" height="42" rx="21.0" fill="#7d3c98"/><text x="1005.0" y="734.65" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#fff" text-anchor="middle" font-weight="bold">DET</text><rect x="1095" y="707" width="150" height="42" rx="21.0" fill="#dcdcdc"/><text x="1170.0" y="734.65" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#333" text-anchor="middle" font-weight="bold">GPIO21</text><rect x="1260" y="707" width="185" height="42" rx="21.0" fill="#e8e8e8"/><text x="1352.5" y="733.6" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#333" text-anchor="middle" font-weight="bold">GP28 (34)</text><circle cx="150" cy="856" r="5" fill="#2e8b57"/><text x="168" y="862" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#444" text-anchor="start">BCLK/LRCK are adjacent (GP3/GP4, WS = BCLK+1) — stock side-set PIO I²S works on the Pico unmodified.</text><circle cx="150" cy="886" r="5" fill="#2b6cb0"/><text x="168" y="892" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#444" text-anchor="start">SDA/SCL land on GP0/GP1 — hardware I²C0, the MicroPython default pair.</text><circle cx="150" cy="916" r="5" fill="#0f766e"/><text x="168" y="922" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#444" text-anchor="start">MCLK sits over the Pico’s ADC_VREF (✕ = not a GPIO): harmless, both ends passive. Pico runs the ES8389 in SCLK-source</text><circle cx="150" cy="946" r="5" fill="#0f766e"/><text x="168" y="952" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#444" text-anchor="start">mode (reg 0x02 bit 6 = 0). R28 (0 Ω, at J4.6) is fitted by default — lift it on a Pico build that uses the Pico’s own ADC.</text><circle cx="150" cy="976" r="5" fill="#7d3c98"/><text x="168" y="982" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#444" text-anchor="start">DET (instrument auto-detect, active-low) works on both hosts via GP28.  ·  pass-thru pins are unused by the hat.</text></svg>