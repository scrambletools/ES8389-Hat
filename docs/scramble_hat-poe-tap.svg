<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1056" viewBox="0 0 1560 1056"><rect width="1560" height="1056" fill="#fafafa"/><text x="780.0" y="50" font-family="DejaVu Sans, sans-serif" font-size="32" fill="#111" text-anchor="middle" font-weight="bold">Phantom power source — tapping the PoE rail for the Hat-trik</text><text x="780.0" y="86" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#555" text-anchor="middle">Waveshare ESP32-P4-ETH carrier + its plug-in PoE module · the tap feeds ONLY the hat’s 48 V phantom generator</text><rect x="60" y="150" width="420" height="500" rx="10" fill="#eef3ee" stroke="#5a7d5a" stroke-width="2.5"/><text x="80" y="186" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#2f4f2f" text-anchor="start" font-weight="bold">ESP32-P4-ETH carrier</text><rect x="95" y="230" width="180" height="120" rx="10" fill="#dfe8df" stroke="#5a7d5a" stroke-width="2"/><text x="185" y="278" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#333" text-anchor="middle" font-weight="bold">RJ45 mag-jack</text><text x="185" y="301" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#666" text-anchor="middle">(PoE-capable)</text><line x1="20" y1="290" x2="95" y2="290" stroke="#888" stroke-width="5"/><text x="84" y="388" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#666" text-anchor="start">Ethernet from PoE switch / injector</text><text x="426" y="222" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#2f4f2f" text-anchor="end" font-weight="bold">H7 — PoE module header</text><circle cx="430" cy="250" r="11" fill="#d4af37" stroke="#8a731f" stroke-width="2"/><text x="430" y="255" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#333" text-anchor="middle" font-weight="bold">1</text><text x="410" y="255" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#444" text-anchor="end">RJ78</text><circle cx="430" cy="312" r="11" fill="#d4af37" stroke="#8a731f" stroke-width="2"/><text x="430" y="317" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#333" text-anchor="middle" font-weight="bold">2</text><text x="410" y="317" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#444" text-anchor="end">RJ45</text><circle cx="430" cy="374" r="11" fill="#d4af37" stroke="#8a731f" stroke-width="2"/><text x="430" y="379" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#333" text-anchor="middle" font-weight="bold">3</text><text x="410" y="379" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#444" text-anchor="end">RJ36</text><circle cx="430" cy="436" r="11" fill="#d4af37" stroke="#8a731f" stroke-width="2"/><text x="430" y="441" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#333" text-anchor="middle" font-weight="bold">4</text><text x="410" y="441" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#444" text-anchor="end">RJ12</text><circle cx="430" cy="498" r="11" fill="#d4af37" stroke="#8a731f" stroke-width="2"/><text x="430" y="503" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#333" text-anchor="middle" font-weight="bold">5</text><text x="410" y="503" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#444" text-anchor="end">VCC1_5V</text><circle cx="430" cy="560" r="11" fill="#d4af37" stroke="#8a731f" stroke-width="2"/><text x="430" y="565" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#333" text-anchor="middle" font-weight="bold">6</text><text x="410" y="565" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#444" text-anchor="end">GND</text><line x1="275" y1="255" x2="340" y2="255" stroke="#9aa89a" stroke-width="2.5"/><line x1="340" y1="255" x2="340" y2="250" stroke="#9aa89a" stroke-width="2.5"/><line x1="340" y1="250" x2="332" y2="250" stroke="#9aa89a" stroke-width="2.5"/><line x1="275" y1="279" x2="340" y2="279" stroke="#9aa89a" stroke-width="2.5"/><line x1="340" y1="279" x2="340" y2="312" stroke="#9aa89a" stroke-width="2.5"/><line x1="340" y1="312" x2="332" y2="312" stroke="#9aa89a" stroke-width="2.5"/><line x1="275" y1="303" x2="340" y2="303" stroke="#9aa89a" stroke-width="2.5"/><line x1="340" y1="303" x2="340" y2="374" stroke="#9aa89a" stroke-width="2.5"/><line x1="340" y1="374" x2="332" y2="374" stroke="#9aa89a" stroke-width="2.5"/><line x1="275" y1="327" x2="340" y2="327" stroke="#9aa89a" stroke-width="2.5"/><line x1="340" y1="327" x2="340" y2="436" stroke="#9aa89a" stroke-width="2.5"/><line x1="340" y1="436" x2="332" y2="436" stroke="#9aa89a" stroke-width="2.5"/><text x="300" y="486" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#667a66" text-anchor="middle">pair centre taps (raw PoE pairs)</text><text x="410" y="600" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#8a6d1f" text-anchor="end">H7.5/H7.6 = the module’s isolated 5 V + GND</text><text x="410" y="622" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#8a6d1f" text-anchor="end">→ powers the carrier (pre-mux input)</text><rect x="540" y="150" width="430" height="500" rx="10" fill="#eef0f5" stroke="#4a5b7d" stroke-width="2.5"/><text x="560" y="186" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#2f3f63" text-anchor="start" font-weight="bold">PoE module  (plugs onto H7)</text><rect x="575" y="225" width="360" height="64" rx="10" fill="#dee3ee" stroke="#4a5b7d" stroke-width="2"/><text x="755" y="252" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#333" text-anchor="middle">802.3af detection signature + class</text><text x="755" y="274" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#777" text-anchor="middle">(don’t load the raw pairs — see note 2)</text><rect x="575" y="320" width="360" height="110" rx="10" fill="#dee3ee" stroke="#4a5b7d" stroke-width="2"/><text x="755" y="352" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#333" text-anchor="middle" font-weight="bold">BD1 / BD2 — bridge rectifiers (MB10F)</text><text x="755" y="376" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#666" text-anchor="middle">rectify the pair voltages → 37–57 V DC</text><text x="755" y="398" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#8a1c1c" text-anchor="middle" font-weight="bold">★ TAP HERE: solder to the two bridge outputs</text><rect x="575" y="470" width="360" height="64" rx="10" fill="#dee3ee" stroke="#4a5b7d" stroke-width="2"/><text x="755" y="497" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#333" text-anchor="middle">isolated flyback DC-DC → 5 V</text><text x="755" y="519" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#777" text-anchor="middle">(this side is isolated from the tap!)</text><line x1="442" y1="250" x2="540" y2="250" stroke="#9aa89a" stroke-width="2.5"/><line x1="442" y1="312" x2="540" y2="312" stroke="#9aa89a" stroke-width="2.5"/><line x1="442" y1="374" x2="540" y2="374" stroke="#9aa89a" stroke-width="2.5"/><line x1="442" y1="436" x2="540" y2="436" stroke="#9aa89a" stroke-width="2.5"/><line x1="575" y1="502" x2="441" y2="498" stroke="#b8860b" stroke-width="3"/><line x1="575" y1="516" x2="470" y2="516" stroke="#b8860b" stroke-width="3"/><line x1="470" y1="516" x2="470" y2="560" stroke="#b8860b" stroke-width="3"/><line x1="470" y1="560" x2="441" y2="560" stroke="#b8860b" stroke-width="3"/><circle cx="935" cy="345" r="13" fill="#c0392b" stroke="#7c241a" stroke-width="2.5"/><text x="935" y="351" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#fff" text-anchor="middle" font-weight="bold">+</text><circle cx="935" cy="405" r="13" fill="#3d3d3d" stroke="#111" stroke-width="2.5"/><text x="935" y="411" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#fff" text-anchor="middle" font-weight="bold">−</text><line x1="948" y1="345" x2="1075" y2="345" stroke="#c0392b" stroke-width="5"/><line x1="948" y1="405" x2="1075" y2="405" stroke="#3d3d3d" stroke-width="5"/><text x="1010" y="325" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#8a1c1c" text-anchor="middle" font-style="italic">hand-soldered</text><text x="1010" y="432" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#8a1c1c" text-anchor="middle" font-style="italic">leads</text><rect x="1075" y="150" width="425" height="500" rx="10" fill="#e8f0ea" stroke="#1e5c2f" stroke-width="2.5"/><text x="1095" y="186" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#1e5c2f" text-anchor="start" font-weight="bold">Scramble Hat-trik</text><circle cx="1100" cy="345" r="11" fill="#d4af37" stroke="#8a731f" stroke-width="2"/><text x="1100" y="350" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#333" text-anchor="middle" font-weight="bold">1</text><text x="1122" y="350" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#333" text-anchor="start" font-weight="bold">J5.1  TAP_HV  (+)</text><circle cx="1100" cy="405" r="11" fill="#d4af37" stroke="#8a731f" stroke-width="2"/><text x="1100" y="410" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#333" text-anchor="middle" font-weight="bold">2</text><text x="1122" y="410" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#333" text-anchor="start" font-weight="bold">J5.2  TAP_GND  (−)</text><line x1="1100" y1="416" x2="1100" y2="426" stroke="#999" stroke-width="2"/><line x1="1100" y1="426" x2="1290" y2="426" stroke="#999" stroke-width="2"/><line x1="1290" y1="426" x2="1290" y2="436" stroke="#999" stroke-width="2"/><rect x="1100" y="436" width="380" height="36" rx="18.0" fill="#8a6d1f"/><text x="1290.0" y="458.9" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">F1 — 100 mA / 60 V polyfuse</text><line x1="1290" y1="472" x2="1290" y2="482" stroke="#999" stroke-width="2"/><rect x="1100" y="482" width="380" height="36" rx="18.0" fill="#4a5b7d"/><text x="1290.0" y="504.9" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">K1 / K2 PhotoMOS — SW1 phantom on/off</text><line x1="1290" y1="518" x2="1290" y2="528" stroke="#999" stroke-width="2"/><rect x="1100" y="528" width="380" height="36" rx="18.0" fill="#7d3c98"/><text x="1290.0" y="550.9" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">48 V phantom generator (Q1 high-side)</text><line x1="1290" y1="564" x2="1290" y2="574" stroke="#999" stroke-width="2"/><rect x="1100" y="574" width="380" height="36" rx="18.0" fill="#c2185b"/><text x="1290.0" y="596.9" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">XLR pins 2 &amp; 3 → condenser mic</text><text x="78" y="705" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#8a1c1c" text-anchor="start" font-weight="bold">1.</text><text x="108" y="705" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#444" text-anchor="start">The tap rides the PoE bus BEFORE the module’s isolated DC-DC — 37–57 V DC is present whenever a PoE switch or injector</text><text x="108" y="729" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#444" text-anchor="start">is attached, even with the hat’s phantom switched off. Treat the leads as live.</text><text x="78" y="771" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#8a1c1c" text-anchor="start" font-weight="bold">2.</text><text x="108" y="771" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#444" text-anchor="start">Never add bulk capacitance to the tap (&gt; 0.15 µF breaks the module’s 802.3af detection signature — the carrier will not</text><text x="108" y="795" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#444" text-anchor="start">power up on PoE). The hat is designed for this: its reservoir sits after Q1, not on the tap bus.</text><text x="78" y="837" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#8a1c1c" text-anchor="start" font-weight="bold">3.</text><text x="108" y="837" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#444" text-anchor="start">The PoE module has no connector for the tap — hand-solder the two leads directly to the bridge-rectifier outputs.</text><text x="78" y="881" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#8a1c1c" text-anchor="start" font-weight="bold">4.</text><text x="108" y="881" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#444" text-anchor="start">Verify + and − at the bridge outputs with a meter before wiring — a reversed tap defeats D6/Q1 protection.</text><text x="78" y="925" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#8a1c1c" text-anchor="start" font-weight="bold">5.</text><text x="108" y="925" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#444" text-anchor="start">Raspberry Pi Pico builds: a Pico has no Ethernet, so nothing like this front end exists — phantom power is unavailable</text><text x="108" y="949" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#444" text-anchor="start">unless an equivalent isolated 44–57 V source feeds J5 with the same polarity. Every other hat function works on the Pico.</text></svg>